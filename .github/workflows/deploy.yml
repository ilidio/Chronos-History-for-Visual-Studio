name: Build and Deploy VSIX

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger on version tags like v1.0.0
  workflow_dispatch: # Allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0 # Fetch all history for all tags and branches

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.x' # Or appropriate version for runner tools

    - name: Restore NuGet Packages
      run: nuget restore Chronos-History-VS.sln

    - name: Build VSIX
      run: |
        msbuild Chronos-History-VS.sln /p:Configuration=Release /p:DeployExtension=false /t:Build
        msbuild Chronos-History-VS.csproj /p:Configuration=Release /p:DeployExtension=false /t:CreateVsixContainer /p:ZipPackageCompressionLevel=Normal

    - name: Upload VSIX Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Chronos-History-VSIX
        path: bin/Release/*.vsix

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ github.ref_name }} bin/Release/*.vsix --title "Release ${{ github.ref_name }}" --generate-notes
